<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>CAIPORAH — Redirecionando fonte</title>
<style>
html,body{width:100%;height:100%;margin:0;background:transparent;color:#fff;font:14px Arial,sans-serif}
body{display:grid;place-items:center}
p{padding:12px 18px;border-radius:10px;background:#111b}
a{color:#c4b5fd}
</style>
</head>
<body>
<p>Atualizando a fonte do overlay… <a id="fallback" href="./index.html">Abrir fonte</a></p>
<script>
(function(){
  // Mantém todos os parâmetros antigos (?tipo=, nome, texto, cor, etc.)
  // e entrega a renderização ao mesmo motor usado pelo editor (?s=).
  const target=new URL('./index.html',location.href);
  target.search=location.search;
  target.hash=location.hash;
  document.getElementById('fallback').href=target.href;
  location.replace(target.href);
})();
</script>
<noscript><p>Ative JavaScript para abrir a fonte do overlay.</p></noscript>
</body>
</html>
