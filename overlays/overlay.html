<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>CAIPORAH · Atualizando fonte</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090711;color:#fff;font:16px Arial,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
p{color:#c4b5fd;line-height:1.6}a{color:#fff}
</style>
</head>
<body>
<main><div><strong>CAIPORAH OVERLAYS</strong><p>Atualizando o endereço da fonte…</p><a id="fallback" href="./index.html">Abrir fonte manualmente</a></div></main>
<script>
(()=>{
  const old=new URLSearchParams(location.search);
  const next=new URL('index.html',location.href);
  // Fontes recentes são encaminhadas sem alterar a configuração.
  if(old.has('s')||old.has('t')){
    for(const [k,v] of old)next.searchParams.set(k,v);
  }else{
    const types=['ticker','lower','social','live','break','pix','camera'];
    const type=types.includes((old.get('tipo')||'ticker').toLowerCase())?(old.get('tipo')||'ticker').toLowerCase():'ticker';
    next.searchParams.set('t',type);
    const palette=(old.get('paleta')||'').toLowerCase();
    const categories={gold:'geral',purple:'geral',red:'fps',blue:'tech',cyan:'tech',pink:'vlog',green:'fut',lime:'fut',orange:'race',ice:'prata',white:'prata',bronze:'rpg',rainbow:'retro'};
    next.searchParams.set('cat',categories[palette]||'geral');
    const styles={minimal:0,classic:1,neon:2,glass:3,esports:4,tech:5,retro:6,luxury:7};
    const style=styles[(old.get('modelo')||'minimal').toLowerCase()]??0;
    const shapes=['redonda','quadrada','quadrada-arredondada','retangular-horizontal','retangular-vertical','triangular','hexagonal','losango','panoramica','grande-4-3'];
    const shape=(old.get('forma')||'').toLowerCase();
    const shapeIndex=type==='camera'&&shapes.includes(shape)?shapes.indexOf(shape):0;
    next.searchParams.set('m',String(shapeIndex*16+style));
    const values={};
    if(type==='ticker'){values.x=old.get('marca')||'Geral';values.y=old.get('texto')||'SEJA BEM-VINDO À TRANSMISSÃO';}
    if(type==='lower'){values.x=old.get('nome')||'CAIPORAH';values.y=old.get('marca')||'Streamer oficial';values.z=old.get('texto')||'AO VIVO AGORA';}
    if(type==='social'){values.x=old.get('nome')||'@CAIPORAH';}
    if(type==='live'){values.x=old.get('texto')||'AO VIVO';}
    if(type==='break'){values.x=old.get('titulo')||'JÁ VOLTAMOS';values.y=old.get('texto')||'AGUARDE UM INSTANTE';}
    if(type==='pix'){values.x=old.get('nome')||'APOIADOR';values.y=old.get('texto')||'MUITO OBRIGADO!';}
    if(type==='camera'){values.x=old.get('nome')||'CAIPORAH';}
    for(const [k,v] of Object.entries(values))next.searchParams.set(k,v);
    const color=old.get('cor')||'';
    if(/^#[0-9a-f]{6}$/i.test(color))next.searchParams.set('c',color.slice(1));
  }
  document.getElementById('fallback').href=next.href;
  location.replace(next.href);
})();
</script>
<noscript><main>Ative o JavaScript para abrir a fonte atualizada.</main></noscript>
</body>
</html>
