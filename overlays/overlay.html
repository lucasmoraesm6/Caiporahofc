<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>CAIPORAH Overlay Source</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent!important;overflow:hidden}
body{font-family:Outfit,Arial,sans-serif;color:#fff}
:root{--gold:#e8bd63;--gold2:#f7dfa0;--black:#090909}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
/* Isolamento rígido: somente o elemento escolhido pela URL pode aparecer. */
.overlay-source{display:none!important}
.overlay-source.is-active{display:flex!important}
#lower.is-active,#pix.is-active,#camera.is-active,#frame.is-active{display:block!important}
#ticker{position:absolute;left:0;right:0;bottom:0;height:62px;padding:0;overflow:hidden;background:linear-gradient(90deg,#090909f5,#20180bf2 50%,#090909f5);border-top:2px solid var(--gold);box-shadow:0 -5px 22px #0007;align-items:center}
#ticker .brand{height:100%;min-width:150px;padding:0 22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(110deg,#9c702b,#f1d48a);color:#110d07;font:900 17px Unbounded;white-space:nowrap}
#ticker .track{overflow:hidden;white-space:nowrap;flex:1}
#ticker .moving{display:inline-block;padding-left:100%;font-size:22px;font-weight:700;letter-spacing:.04em;color:#fff;animation:marquee 22s linear infinite}
#camera{position:absolute;right:4%;bottom:5%;width:32%;height:30%;border:4px solid var(--gold);border-radius:16px;box-shadow:0 0 0 2px #090909,0 8px 28px #0008}

@media(max-width:600px){#camera{width:42%;height:25%;right:3%;bottom:4%}}
@keyframes marquee{to{transform:translateX(-100%)}}
#lower{position:absolute;left:4%;bottom:9%;min-width:420px;max-width:75%;padding:15px 25px 15px 22px;border-left:7px solid var(--gold);border-radius:4px 13px 13px 4px;background:linear-gradient(100deg,#090909ed,#21190ee8);box-shadow:0 8px 28px #0007}
#lower .brand{font-size:13px;font-weight:900;letter-spacing:.22em;color:var(--gold2)}
#lower .name{font:800 34px Unbounded,Outfit,sans-serif;line-height:1.25;margin:3px 0}
#lower .tag{font-size:16px;letter-spacing:.12em;color:#e9d8b1;font-weight:700}
#social{position:absolute;right:4%;top:7%;align-items:center;gap:13px;padding:13px 20px;border:1px solid #e8bd63;border-radius:13px;background:linear-gradient(110deg,#090909ed,#34250feF);box-shadow:0 7px 26px #0008}
#social .play{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#a7772b,#f4d98e);color:#100c06;font-size:19px}
#social b{display:block;font-size:19px;letter-spacing:.05em}
#social small{display:block;color:var(--gold2);font-size:11px;letter-spacing:.16em;font-weight:800}
#live{position:absolute;right:4%;top:5%;align-items:center;gap:10px;padding:10px 16px;border-radius:9px;background:#090909eF;border:1px solid #e8bd63;box-shadow:0 5px 20px #0007;font-weight:900;letter-spacing:.12em}
#live .dot{width:11px;height:11px;border-radius:50%;background:#ff4545;box-shadow:0 0 12px #ff4545;animation:pulse 1.3s infinite}
#live .gold{color:var(--gold2)}
@keyframes pulse{50%{opacity:.35}}
#break{position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse at center,#21190bc9,transparent 65%)}
#break .eyebrow{font-size:22px;letter-spacing:.35em;color:var(--gold2);font-weight:800}
#break .logo{margin:14px 0;font:900 clamp(45px,8vw,100px) Unbounded;color:#fff;text-shadow:0 6px 28px #000}
#break .sub{font-size:20px;letter-spacing:.2em;color:#eee;font-weight:700}
#pix{position:absolute;left:50%;top:12%;transform:translateX(-50%);min-width:370px;padding:19px 28px;text-align:center;border:1px solid var(--gold);border-radius:17px;background:linear-gradient(130deg,#080808f5,#39290ff2);box-shadow:0 10px 40px #0009}
#pix .star{font-size:24px;color:var(--gold2)}
#pix b{display:block;margin:3px 0;font:800 23px Unbounded;color:var(--gold2)}
#pix .who{font-size:19px;font-weight:800}
#pix .amount{font-size:25px;font-weight:900;color:#fff}
@media(max-width:600px){#ticker{height:48px;left:0;right:0;bottom:0}#ticker .brand{min-width:100px;font-size:12px;padding:0 10px}#ticker .moving{font-size:16px}#lower{left:2%;bottom:5%;min-width:0;max-width:94%;padding:10px 14px}#lower .name{font-size:23px}#lower .tag{font-size:12px}#social{right:2%;top:3%;padding:9px 12px}#social b{font-size:15px}#pix{min-width:0;width:90%;top:8%}}
</style></head>
<body><main id="stage">
<div id="ticker" class="overlay-source"><div class="brand">CAIPORAH</div><div class="track"><div class="moving" id="tickerText">SEJA BEM-VINDO À TRANSMISSÃO　✦　INSCREVA-SE NO CANAL　✦　COMPARTILHE A LIVE</div></div></div>
<div id="camera" class="overlay-source" aria-label="Moldura independente para câmera"></div>
<div id="lower" class="overlay-source"><div class="brand" id="lowerBrand">CAIPORAH · TRANSMISSÃO</div><div class="name" id="lowerName">SEU NOME AQUI</div><div class="tag" id="lowerTag">AO VIVO AGORA</div></div>
<div id="social" class="overlay-source"><div class="play">▶</div><div><b id="socialName">@CAIPORAH</b><small id="socialText">ACOMPANHE NAS REDES</small></div></div>
<div id="live" class="overlay-source"><span class="dot"></span> <span class="gold" id="liveBrand">CAIPORAH</span> <span id="liveText">AO VIVO</span></div>
<div id="break" class="overlay-source"><div class="eyebrow" id="breakTitle">JÁ VOLTAMOS</div><div class="logo" id="breakBrand">CAIPORAH</div><div class="sub" id="breakSub">AGUARDE UM INSTANTE</div></div>
<div id="pix" class="overlay-source"><div class="star">✦ ✦ ✦</div><b>PIX RECEBIDO!</b><div class="who" id="pixName">APOIADOR</div><div class="amount" id="pixAmount">MUITO OBRIGADO!</div></div>
</main>
<script>
const p=new URLSearchParams(location.search);
const type=(p.get('tipo')||'ticker').toLowerCase();
const show={ticker:'ticker',lower:'lower',social:'social',live:'live',break:'break',pix:'pix',camera:'camera'}[type]||'ticker';
document.querySelectorAll('.overlay-source').forEach(node=>node.classList.remove('is-active'));
const el=document.getElementById(show);
if(el)el.classList.add('is-active');
const safe=(v,fallback)=>v&&v.trim()?v.trim():fallback;
document.getElementById('lowerName').textContent=safe(p.get('nome'),'SEU NOME AQUI');
document.getElementById('lowerBrand').textContent=safe(p.get('marca'),'CAIPORAH · TRANSMISSÃO');
document.getElementById('lowerTag').textContent=safe(p.get('texto'),'AO VIVO AGORA');
document.getElementById('socialName').textContent=safe(p.get('nome'),'@CAIPORAH');
document.getElementById('socialText').textContent=safe(p.get('texto'),'ACOMPANHE NAS REDES');
document.getElementById('pixName').textContent=safe(p.get('nome'),'APOIADOR');
document.getElementById('pixAmount').textContent=safe(p.get('texto'),'MUITO OBRIGADO!');
document.getElementById('liveBrand').textContent=safe(p.get('marca'),'CAIPORAH');
document.getElementById('liveText').textContent=safe(p.get('texto'),'AO VIVO');
document.getElementById('breakTitle').textContent=safe(p.get('titulo'),'JÁ VOLTAMOS');
document.getElementById('breakBrand').textContent=safe(p.get('marca'),'CAIPORAH');
document.getElementById('breakSub').textContent=safe(p.get('texto'),'AGUARDE UM INSTANTE');
const cameraColor=p.get('cor');
if(cameraColor&&/^#[0-9a-fA-F]{6}$/.test(cameraColor))document.getElementById('camera').style.borderColor=cameraColor;
const tickerText=safe(p.get('texto'),'SEJA BEM-VINDO À TRANSMISSÃO　✦　INSCREVA-SE NO CANAL　✦　COMPARTILHE A LIVE');
document.getElementById('tickerText').textContent=tickerText+'　✦　'+tickerText+'　✦　';
</script></body></html>
