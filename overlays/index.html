select,input[type=text],input[type=number]{background:#0b0818;border:1px solid #3a2f63;color:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;max-width:100%}

.main{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) 290px}
.side{border-right:1px solid #2a2245;padding:8px;overflow:auto;display:flex;flex-direction:column;gap:6px}

.gh{font-size:11px;letter-spacing:1.5px;color:#8a7dbb;margin:8px 4px 2px}

.pw{width:min(100%,max(300px,calc((100vh - 330px)*1.7778)));margin:0 auto}

.pane{display:none;flex-direction:column;gap:10px}.pane.on{display:flex}
.fl,.ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ed label,.rt label{display:block;font-size:12px;color:#a99bde}
.fl input[type=text],.ag select,.ag input[type=number]{width:100%;margin-top:2px}

.mod{display:flex;align-items:center;gap:6px;background:#0b0818;border:1px solid #2a2245;border-radius:10px;padding:4px}
.mod span{flex:1;text-align:center;font-size:12px;color:#d9cffc}
.arr{width:34px;height:32px;border:0;border-radius:8px;background:#241b45;color:#fff;font-size:14px;cursor:pointer}
.arr:hover{background:#8b5cf6}
.rt{border-left:1px solid #2a2245;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.rt h2{font-family:Impact,sans-serif;font-weight:400;letter-spacing:2px;font-size:18px;margin:0}
.rt .box{cursor:default}
#scn-list{max-height:170px;overflow:auto}
.rt a{color:#c4b5fd;font-size:12px}
.fs .box{border:0;border-radius:0}
@media(max-width:900px){#app.g{height:auto;min-height:100vh}.main{display:flex;flex-direction:column}
.side{flex-direction:column;border-right:0;border-bottom:1px solid #2a2245}
.gchips{flex-wrap:nowrap;overflow-x:auto}#ol{display:flex;gap:4px;overflow-x:auto}.oi{width:auto;white-space:nowrap}.gh{display:none}
.rt{border-left:0;border-top:1px solid #2a2245}.pw{width:100%}.top h1{font-size:17px}.tag{display:none}}
/* palco 1920x1080 */
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:var(--f);overflow:hidden}
body.ov .stage{position:fixed}
.pn{background:var(--sbg);border:var(--sbd);box-shadow:var(--ssh);border-radius:var(--srd);clip-path:var(--scp);backdrop-filter:var(--sbf);color:var(--stc);text-shadow:var(--sts)}

.ic{width:110px;height:110px;border-radius:var(--r);background:var(--sic);display:flex;align-items:center;justify-content:center;font-size:64px;flex:none}
.tk{position:absolute;height:96px;display:flex;overflow:hidden}
.tk b{background:var(--sic);color:#fff;padding:0 44px;font-size:42px;line-height:86px;white-space:nowrap}
.mq{flex:1;overflow:hidden}
.mq span{display:inline-block;white-space:nowrap;font-size:42px;line-height:86px;animation:mq 26s linear infinite}

.lw{position:absolute;padding:20px 50px 20px 20px;display:flex;gap:26px;align-items:center}
.lw p{font-size:34px;margin-top:4px}
.lv{position:absolute;padding:16px 40px;display:flex;gap:20px;align-items:center;font-size:46px;font-weight:900;text-transform:uppercase}
.lv i{width:28px;height:28px;border-radius:50%;background:var(--sa);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.2}}
.so{position:absolute;padding:16px 36px;display:flex;gap:22px;align-items:center;font-size:42px;font-weight:700}
.so b{background:var(--sic);color:#fff;padding:4px 18px;border-radius:var(--r);font-size:34px}
.br{position:absolute;inset:0;display:flex;background:transparent;pointer-events:none}.br .bx{pointer-events:auto}
.bx{padding:60px 110px;text-align:center}
.bx h1{font-size:130px}
.bx p{font-size:46px;margin-top:14px}
.cd{font-size:210px;font-weight:900;line-height:1.1;color:var(--sa)}
.cm{position:absolute;border:var(--cbd);border-radius:var(--srd);box-shadow:var(--ssh)}
.cm span{position:absolute;left:24px;bottom:-34px;background:var(--a);color:#fff;padding:6px 26px;font-size:30px;font-weight:700;border-radius:var(--r);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.px{position:absolute;width:960px;padding:26px 50px;display:flex;gap:30px;align-items:center;animation:pop 3s ease-in-out infinite}
.px p{font-size:34px}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.gl{position:absolute;width:720px;padding:26px 34px}
.gh{display:flex;justify-content:space-between;font-size:38px;font-weight:900;text-transform:uppercase}
.gb{height:30px;background:rgba(128,128,128,.35);border-radius:var(--r);margin-top:16px;overflow:hidden}
.gb u{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,var(--a),var(--b))}
.ch{position:absolute;width:540px;overflow:hidden}
.ch .h{background:var(--sic);color:#fff;padding:16px 28px;font-size:36px;font-weight:900}
.ch .m{padding:12px 28px;font-size:30px}
.ch .m b{color:var(--sb)}
.stage{color:var(--tx)}
.bk{position:absolute;display:flex;align-items:center;gap:26px;padding:20px 44px;white-space:nowrap}
.bk.col{flex-direction:column;align-items:flex-start;gap:10px;white-space:normal}
.bk.cn{align-items:center}
.bk.tw{justify-content:center;text-align:center;white-space:normal}
.bk h1{font-size:52px}.bk p{font-size:32px}
.stage .nt{text-transform:none;font-size:46px}
.lbl{font-size:28px;letter-spacing:4px;text-transform:uppercase;color:var(--sb);font-weight:700}
.big{font-size:120px;font-weight:900;line-height:1;color:var(--sa)}.big.sm{font-size:80px}
.li{font-size:38px;font-weight:700}
.chp{display:inline-block;background:var(--sic);color:#fff;padding:6px 26px;border-radius:99px;font-size:38px;font-weight:700;text-shadow:none}
.pb{width:100%;height:50px;background:rgba(128,128,128,.3);border-radius:var(--r);overflow:hidden}
.pb u{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));font-size:30px;line-height:50px;padding:0 16px;color:#fff;text-decoration:none;text-shadow:none}
.pp{animation:pop 1.6s ease-in-out infinite}
.eq{display:flex;align-items:flex-end;gap:8px;height:80px}.eq i{width:14px;background:var(--sa);animation:eq .9s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.6s}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
.vt{writing-mode:vertical-rl;font-size:48px;font-weight:900;letter-spacing:6px;text-transform:uppercase}
.bell{animation:rg 1.4s infinite}@keyframes rg{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(-16deg)}20%,40%{transform:rotate(16deg)}}
.crw{height:480px;overflow:hidden;margin-top:20px}.cri{animation:cr 14s linear infinite}.cri p{font-size:44px;margin:14px 0}@keyframes cr{from{transform:translateY(480px)}to{transform:translateY(-100%)}}
:root{--pv:repeating-conic-gradient(#171230 0 25%,#0f0b20 0 50%);--pvs:24px 24px}
.lay{position:absolute;inset:0;font-family:var(--f);color:var(--tx);animation-duration:var(--d,.6s);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@keyframes i-fade{from{opacity:0}}@keyframes o-fade{to{opacity:0}}
@keyframes i-left{from{transform:translateX(-700px);opacity:0}}@keyframes o-left{to{transform:translateX(-700px);opacity:0}}
@keyframes i-right{from{transform:translateX(700px);opacity:0}}@keyframes o-right{to{transform:translateX(700px);opacity:0}}
@keyframes i-up{from{transform:translateY(400px);opacity:0}}@keyframes o-up{to{transform:translateY(400px);opacity:0}}
@keyframes i-down{from{transform:translateY(-400px);opacity:0}}@keyframes o-down{to{transform:translateY(-400px);opacity:0}}
@keyframes i-zoom{from{transform:scale(.3);opacity:0}}@keyframes o-zoom{to{transform:scale(.3);opacity:0}}
@keyframes i-flip{from{transform:perspective(900px) rotateY(90deg);opacity:0}}@keyframes o-flip{to{transform:perspective(900px) rotateY(-90deg);opacity:0}}
@keyframes i-bounce{0%{transform:translateY(-600px);opacity:0}55%{transform:translateY(40px);opacity:1}75%{transform:translateY(-16px)}90%{transform:translateY(6px)}100%{transform:none}}
@keyframes o-bounce{0%{transform:none}30%{transform:translateY(30px);opacity:1}100%{transform:translateY(-600px);opacity:0}}
.btn.g{background:#241b45;color:#e6deff}

.card[hidden]{display:none}

  const op=(a,sel)=>a.map(([v,l])=>`<option value="${v}"${String(v)===String(sel)?' selected':''}>${l}</option>`).join('');
  const d0=dflt(cur),pbox=$('pbox'),ed=$('ed'),tabs=$('tabs');
  tabs.innerHTML=`<div class="tabs"><button class="tb on" data-tab="0">Conteúdo</button><button class="tb" data-tab="1">Tempo e animação</button><button class="tb" data-tab="2">Aparência</button></div>

  <label>Tempo na tela (s) · 0 = sempre<input type="number" min="0" step="1" data-k="sh"></label>

  <label>Duração da animação (s)<input type="number" min=".1" max="3" step=".1" data-k="d"></label>
  <label>Som de entrada<select data-k="si">${op(SNDS)}</select></label>
  <label>Som de saída<select data-k="so">${op(SNDS)}</select></label>
  <label>Volume: <b data-o="vl"></b>%<input type="range" min="0" max="100" data-k="vl"></label></div></div>
  <div class="pane"><div class="ag">
  <label>Fonte<select data-k="f">${op(FONTS.map((f,i)=>[i,f[0]]))}</select></label>
  <label>Tamanho: <b data-o="s"></b>%<input type="range" min="20" max="300" step="1" data-k="s"></label>
  <label>Posição horizontal: <b data-o="x"></b> px<input type="range" min="-1920" max="1920" step="1" data-k="x"></label>
  <label>Posição vertical: <b data-o="y"></b> px<input type="range" min="-1080" max="1080" step="1" data-k="y"></label>
  <label>Opacidade: <b data-o="o"></b>%<input type="range" min="10" max="100" data-k="o"></label></div>
  <div><button class="btn g" data-reset>RESETAR POSIÇÃO</button></div><p class="mt">Arraste o overlay para mover. Use a alça no canto inferior direito para redimensionar ou ajuste tamanho e posição nos controles. O fundo externo permanece transparente na fonte de navegador.</p></div>`;
  const draw=force=>{const k=get(cur),ei=EL.findIndex(x=>x[0]===cur),N=NS*EL[ei][5].length;pbox._s&&pbox._s();pbox.innerHTML=stageHTML([k]);if(typeof resizeHandle!=='undefined')pbox.appendChild(resizeHandle);fit(pbox);pbox._s=run(pbox,[k],force);$('mn').textContent=`Modelo ${k.m+1} de ${N} · ${modelName(ei,k.m)}`;if(tabs.querySelector('.pane.on'))tabs.querySelectorAll('[data-k]').forEach(el=>{const q=el.dataset.k;if(q&&q!=='k'){el.value=k[q]??0;const o=tabs.querySelector(`[data-o="${q}"]`);if(o)o.textContent=k[q]??0}});placeResizeHandle()};
  function sync(){
    const k=get(cur),e=EL.find(x=>x[0]===cur),t=TH.find(x=>x.id===k.c);
    $('ttl').textContent=e[1];$('dsc').textContent=e[2];
    $('fl').innerHTML=e[3].length?e[3].map((l,i)=>`<label>${l}<input type="text" data-i="${i}" value="${esc(k.v[i])}"></label>`).join(''):'<p class="mt">Este overlay não tem texto para editar.</p>';
    tabs.querySelectorAll('#cats .chip').forEach(x=>x.classList.toggle('on',x.dataset.c===k.c));
    $('col').value=k.k||t.a;
    tabs.querySelectorAll('[data-k]').forEach(el=>{const q=el.dataset.k;if(q==='k')return;el.value=k[q];const o=tabs.querySelector(`[data-o="${q}"]`);if(o)o.textContent=k[q]});
    draw();
  }
  function renderList(){$('ol').innerHTML=Object.entries(GR).filter(([n])=>!grp||grp===n).map(([n,ids])=>`<div class="gh">${n}</div>`+ids.map(id=>`<button class="oi${id===cur?' on':''}" data-id="${id}">${EL.find(x=>x[0]===id)[1]}</button>`).join('')).join('')}
  [['Todos',null],...Object.keys(GR).map(n=>[n,n])].forEach(([n,g])=>{const b=document.createElement('button');b.className='chip'+(g?'':' on');b.textContent=n;b.onclick=()=>{grp=g;[...$('gr').children].forEach(x=>x.classList.toggle('on',x===b));renderList()};$('gr').appendChild(b)});
  $('ol').onclick=ev=>{const b=ev.target.closest('.oi');if(!b)return;cur=b.dataset.id;$('ol').querySelectorAll('.oi').forEach(x=>x.classList.toggle('on',x===b));sync()};
  ed.addEventListener('click',ev=>{
    const b=ev.target.closest('button');if(!b)return;const q=b.dataset,k=get(cur),N=NS*EL.find(x=>x[0]===cur)[5].length;
    if(q.tab!==undefined){tabs.querySelectorAll('.tb').forEach((x,i)=>x.classList.toggle('on',i==q.tab));tabs.querySelectorAll('.pane').forEach((x,i)=>x.classList.toggle('on',i==q.tab))}
    else if(q.c!==undefined){k.c=q.c;k.k=null;sync()}
    else if(q.r)(k.m=Math.floor(Math.random()*N),draw());
    else if(q.d)(k.m=(k.m+ +q.d+N)%N,draw());
    else if(q.copy!==undefined)copy(base+'?s='+enc([k]),b,'COPIAR LINK');
    else if(q.add!==undefined){scene.push(JSON.parse(JSON.stringify(k)));save();drawScene();toast('Adicionado à cena ('+scene.length+')')}
    else if(q.t!==undefined)draw(true);
    else if(q.reset!==undefined){k.x=0;k.y=0;draw()}
    else if(q.fs!==undefined)full(()=>[k]);
  });
  ed.addEventListener('input',ev=>{const el=ev.target,q=el.dataset.k,k=get(cur);
    if(el.dataset.i!==undefined)k.v[el.dataset.i]=el.value;
    else if(q){let x=el.value;if(el.type==='number'||el.type==='range')x=parseFloat(x)||0;else if(q==='f')x=+x;if(q==='d')x=Math.max(.1,x||.6);k[q]=x;const o=tabs.querySelector(`[data-o="${q}"]`);if(o)o.textContent=x}

  let dg=null;
  const resizeHandle=document.createElement('div');resizeHandle.className='overlay-resize-handle';resizeHandle.setAttribute('aria-label','Redimensionar overlay');resizeHandle.title='Arraste para redimensionar';pbox.appendChild(resizeHandle);
  const activeTarget=()=>{const lay=pbox.querySelector('.lay');return lay?.querySelector('.br .bx')||lay?.firstElementChild};
  function placeResizeHandle(){const r=activeTarget();if(!r)return;const a=r.getBoundingClientRect(),b=pbox.getBoundingClientRect();resizeHandle.style.left=(a.right-b.left-11)+'px';resizeHandle.style.top=(a.bottom-b.top-11)+'px';resizeHandle.style.display='block'}
  resizeHandle.style.cssText='position:absolute;z-index:30;width:22px;height:22px;border:2px solid #fff;border-radius:6px;background:#8b5cf6;box-shadow:0 2px 10px #0009;touch-action:none;cursor:nwse-resize;display:none';
  resizeHandle.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();const r=activeTarget();if(!r)return;dg={mode:'size',r,k:get(cur),x:ev.clientX,y:ev.clientY,base:get(cur).s};resizeHandle.setPointerCapture(ev.pointerId)});
  pbox.addEventListener('pointerdown',ev=>{if(ev.target===resizeHandle)return;const k=get(cur),r=activeTarget();if(!r)return;dg={mode:'move',r,k,x:ev.clientX,y:ev.clientY,ox:k.x,oy:k.y};pbox.setPointerCapture(ev.pointerId);pbox.style.cursor='grabbing'});
  pbox.addEventListener('pointermove',ev=>{if(!dg)return;const sc=1920/pbox.clientWidth;if(dg.mode==='size'){const delta=Math.max(ev.clientX-dg.x,ev.clientY-dg.y);dg.k.s=Math.max(20,Math.min(300,Math.round(dg.base+delta*sc/10)));dg.r.style.scale=String(dg.k.s/100);const b=tabs.querySelector('[data-k="s"]');if(b)b.value=dg.k.s;const o=tabs.querySelector('[data-o="s"]');if(o)o.textContent=dg.k.s}else{dg.k.x=Math.round(dg.ox+(ev.clientX-dg.x)*sc);dg.k.y=Math.round(dg.oy+(ev.clientY-dg.y)*sc);dg.r.style.translate=`${dg.k.x}px ${dg.k.y}px`;for(const q of ['x','y']){const b=tabs.querySelector(`[data-k="${q}"]`);if(b)b.value=dg.k[q];const o=tabs.querySelector(`[data-o="${q}"]`);if(o)o.textContent=dg.k[q]}}placeResizeHandle()});
  const end=()=>{dg=null;pbox.style.cursor=''};pbox.addEventListener('pointerup',end);pbox.addEventListener('pointercancel',end);
  new ResizeObserver(()=>fit(pbox)).observe(pbox);
  renderList();sync();drawScene();
}

// A central de edição mantém a proteção premium existente no site.
// Fontes de navegador do OBS/LiveX (?s= ou ?t=) continuam abrindo sem a tela de login.
if(!P.has('s')&&!P.has('t')){
  const gate=document.getElementById('access-gate');
  const form=document.getElementById('access-form');
  const pass=document.getElementById('access-password');
  const error=document.getElementById('access-error');
  const hashExpected='c7f6f8b13fd7af3539c062e9882f07180f5716e36494e14c7a2b5d139e497ca9';
  const showEditor=()=>{gate.style.display='none';document.getElementById('app').style.display='flex'};
  if(sessionStorage.getItem('caiporahOverlayAccess')==='ok')showEditor();
  else{gate.style.display='flex';document.getElementById('app').style.display='none'}
  form.addEventListener('submit',async ev=>{
    ev.preventDefault();error.textContent='';
    if(!window.crypto||!crypto.subtle){error.textContent='Seu navegador não oferece validação segura. Atualize-o e tente novamente.';return}
    try{
      const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pass.value));
      const hash=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
      if(hash===hashExpected){sessionStorage.setItem('caiporahOverlayAccess','ok');pass.value='';showEditor()}
      else{error.textContent='Senha incorreta. Tente novamente.';pass.value='';pass.focus()}
    }catch(e){error.textContent='Não foi possível validar o acesso neste navegador.'}
  });
}
